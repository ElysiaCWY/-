[package]
name = "resume-manager"
version = "0.1.0"
description = "Offline resume parser for Windows (Tauri)"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["api-all", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zip = "2.2"
quick-xml = "0.31"
pdf-extract = "0.7"
regex = "1.10"
time = { version = "0.3", features = ["formatting"] }
dirs = "5.0"
ureq = { version = "2.10", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

